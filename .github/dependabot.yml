# 🤖 Dependabot Configuration - Enterprise Security Updates
# Auto-generated by ADW Deploy Solution for automated security maintenance

version: 2

updates:
  # NPM Dependencies - High Priority
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
      time: "02:00"
      timezone: "UTC"
    open-pull-requests-limit: 10
    reviewers:
      - "vision-maestra-team"
    assignees:
      - "vision-maestra-team"
    commit-message:
      prefix: "🔒 security"
      include: "scope"
    labels:
      - "dependencies"
      - "security"
      - "auto-generated"
    ignore:
      # Ignore major version updates for stable dependencies
      - dependency-name: "express"
        update-types: ["version-update:semver-major"]
      - dependency-name: "socket.io"
        update-types: ["version-update:semver-major"]
    allow:
      # Allow all security updates
      - dependency-type: "all"

  # GitHub Actions - Security Updates
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "02:00"
      timezone: "UTC"
    open-pull-requests-limit: 5
    reviewers:
      - "vision-maestra-team"
    commit-message:
      prefix: "🔧 ci"
      include: "scope"
    labels:
      - "github-actions"
      - "security"
      - "auto-generated"

  # Docker Base Image Updates
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "02:00"
      timezone: "UTC"
    open-pull-requests-limit: 3
    reviewers:
      - "vision-maestra-team"
    commit-message:
      prefix: "🐳 docker"
      include: "scope"
    labels:
      - "docker"
      - "security"
      - "auto-generated"

# Enterprise Security Configuration
# Features:
# ✅ Daily NPM dependency scanning
# ✅ Weekly GitHub Actions updates
# ✅ Weekly Docker base image updates
# ✅ Automatic security labeling
# ✅ Team review assignment
# ✅ Controlled update limits