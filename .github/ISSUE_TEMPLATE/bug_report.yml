name: 🐛 Bug Report
description: Report a bug or unexpected behavior in Visión Maestra Platform
title: "[BUG] "
labels: ["bug", "needs-triage", "platform"]
assignees:
  - vision-maestra-team

body:
  - type: markdown
    attributes:
      value: |
        ## 🚨 Bug Report - Visión Maestra Platform

        Thank you for reporting a bug! Please provide detailed information to help us reproduce and fix the issue.

        **Platform Components**: Dossier, Ruflo V3, GitNexus, ADW Skills, RLM Navigator, Claude Code

  - type: textarea
    id: summary
    attributes:
      label: 🎯 Bug Summary
      description: A clear and concise description of the bug
      placeholder: "The platform fails to..."
    validations:
      required: true

  - type: dropdown
    id: component
    attributes:
      label: 🧩 Affected Component
      description: Which component of the platform is affected?
      options:
        - "Dossier (Frontend + Project Manager)"
        - "Ruflo V3 (CLI Orchestrator)"
        - "GitNexus (Code Graph Analysis)"
        - "ADW Skills (Methodology)"
        - "RLM Navigator (AST Navigation)"
        - "Claude Code (Execution Engine)"
        - "Platform Integration"
        - "Real-time Streaming"
        - "Security System"
        - "Multiple Components"
        - "Unknown/Not Sure"
    validations:
      required: true

  - type: dropdown
    id: severity
    attributes:
      label: 🚨 Severity Level
      description: How severe is this bug?
      options:
        - "Critical - System down/data loss"
        - "High - Major functionality broken"
        - "Medium - Feature partially broken"
        - "Low - Minor issue/cosmetic"
        - "Enhancement - Improvement suggestion"
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: 🔄 Steps to Reproduce
      description: Detailed steps to reproduce the behavior
      value: |
        1. Go to...
        2. Click on...
        3. Execute...
        4. See error...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: ✅ Expected Behavior
      description: What should have happened?
      placeholder: "The platform should..."
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: ❌ Actual Behavior
      description: What actually happened?
      placeholder: "Instead, the platform..."
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: 🖥️ Environment Information
      description: Please provide your environment details
      value: |
        - **OS**: [e.g., macOS 13.0, Ubuntu 22.04, Windows 11]
        - **Node.js Version**: [e.g., 20.9.0]
        - **NPM Version**: [e.g., 10.1.0]
        - **Platform Version**: [e.g., 1.0.0]
        - **Browser**: [e.g., Chrome 119.0, Safari 17.0] (if frontend issue)
        - **Container Runtime**: [e.g., Docker 24.0, Podman 4.0] (if containerized)
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 📋 Error Logs
      description: Paste relevant error logs, stack traces, or console output
      render: shell
      placeholder: |
        Paste logs here...

        Platform logs: npm run logs
        Component logs: npm run logs:component
        Performance metrics: npm run metrics

  - type: textarea
    id: additional
    attributes:
      label: 📎 Additional Context
      description: Add any other context, screenshots, or relevant information
      placeholder: |
        - Screenshots (if applicable)
        - Related issues or PRs
        - Workarounds you've tried
        - Impact on your workflow

  - type: checkboxes
    id: checklist
    attributes:
      label: ✅ Pre-submission Checklist
      options:
        - label: I have searched existing issues to avoid duplicates
          required: true
        - label: I have provided a clear and descriptive title
          required: true
        - label: I have included steps to reproduce the issue
          required: true
        - label: I have specified the affected component(s)
          required: true
        - label: I have provided environment information
          required: true
        - label: I have included relevant logs or error messages
          required: false

  - type: markdown
    attributes:
      value: |
        ---

        **🤖 Auto-generated by ADW Deploy Solution - Enterprise Issue Template**

        The Visión Maestra team will review your bug report and respond as soon as possible.
        For urgent issues, please contact: support@vision-maestra.dev