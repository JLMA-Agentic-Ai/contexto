# ADR Governance Automation Workflow
# Automated ADR lifecycle management for Visión Maestra Platform

name: ADR Governance Automation
version: "1.0.0"
governance_version: "ADW-ENH-001"

# Workflow Triggers
triggers:
  manual:
    - "adw-governance-consolidate"
    - "adw-governance-promote"
    - "adw-governance-validate"

  automated:
    - file_changes: ["docs/adrs/**/*.md"]
    - phase_completion: ["business", "development", "validation", "deployment"]
    - evidence_validation: ["staging/**/*.yml"]

# Workflow Stages
stages:
  # Stage 1: Evidence Collection and Validation
  evidence_validation:
    description: "Validate evidence quality and authority scores"
    tasks:
      - validate_evidence_completeness
      - calculate_authority_scores
      - verify_truth_scores
      - check_source_diversity

    quality_gates:
      - evidence_quality: ">=SOFT"
      - authority_score: ">=0.80"
      - truth_score: ">=0.95"
      - source_count: ">=3"

    automation:
      - auto_enhance_evidence: true
      - escalate_on_failure: true
      - retry_attempts: 3

  # Stage 2: Conflict Detection and Resolution
  conflict_resolution:
    description: "Detect and resolve conflicting ADRs"
    tasks:
      - scan_for_conflicts
      - analyze_authority_gaps
      - apply_resolution_strategy
      - document_alternatives

    strategies:
      - authority_based: "Select higher authority score"
      - evidence_synthesis: "Combine complementary evidence"
      - temporal_precedence: "Prefer recent with equivalent authority"
      - expert_arbitration: "Escalate complex conflicts"

    automation:
      - auto_resolve_threshold: 0.15  # Authority gap for automatic resolution
      - manual_review_threshold: 0.05 # Escalate if gap < 0.05

  # Stage 3: Consolidation and Merging
  consolidation:
    description: "Consolidate related ADRs and merge evidence"
    tasks:
      - identify_mergeable_adrs
      - combine_evidence_sections
      - preserve_authority_sources
      - validate_cross_references

    rules:
      - preserve_all_sources: true
      - maintain_authority_scores: true
      - update_cross_references: true
      - backup_before_merge: true

  # Stage 4: Production Promotion
  production_promotion:
    description: "Promote validated ADRs to production"
    tasks:
      - assign_sequential_numbers
      - generate_final_adrs
      - update_master_index
      - cleanup_staging_area

    validation:
      - verify_numbering_sequence: true
      - validate_all_links: true
      - check_index_integrity: true
      - backup_previous_state: true

  # Stage 5: Governance Reporting
  governance_reporting:
    description: "Generate comprehensive governance reports"
    tasks:
      - calculate_quality_metrics
      - analyze_evidence_trends
      - generate_compliance_report
      - update_governance_dashboard

    outputs:
      - quality_metrics_report
      - evidence_quality_trends
      - authority_score_analysis
      - cross_adr_dependency_map

# Quality Metrics and KPIs
metrics:
  evidence_quality:
    solid_percentage: 0.85        # Target: 85% SOLID evidence
    average_authority_score: 0.90  # Target: 90% average authority
    truth_score_compliance: 0.95   # Target: 95% above threshold
    source_diversity: 0.80         # Target: 80% diverse sources

  process_efficiency:
    consolidation_time_minutes: 5  # Target: <5 minutes
    automated_resolution_rate: 0.90 # Target: 90% auto-resolution
    manual_intervention_rate: 0.10  # Target: <10% manual intervention
    staging_to_production_ratio: 0.85 # Target: 85% promotion rate

  governance_quality:
    adr_link_integrity: 1.0        # Target: 100% valid links
    cross_reference_accuracy: 0.98 # Target: 98% accurate references
    evidence_preservation_rate: 0.95 # Target: 95% evidence preserved
    index_consistency: 1.0         # Target: 100% index consistency

# Automation Configuration
automation:
  evidence_enhancement:
    enabled: true
    max_attempts: 3
    sources_to_add: 2
    authority_boost_threshold: 0.05

  conflict_resolution:
    enabled: true
    auto_resolve_authority_gap: 0.15
    manual_escalation_gap: 0.05
    preserve_alternatives: true

  quality_assurance:
    enabled: true
    truth_score_threshold: 0.95
    evidence_quality_minimum: "SOFT"
    authority_score_minimum: 0.80

  reporting:
    enabled: true
    frequency: "daily"
    dashboard_updates: "real_time"
    compliance_reports: "weekly"

# Integration Hooks
hooks:
  pre_consolidation:
    - backup_staging_area
    - validate_evidence_integrity
    - check_governance_rules

  post_consolidation:
    - update_master_index
    - generate_governance_report
    - cleanup_temporary_files
    - notify_stakeholders

  on_failure:
    - rollback_changes
    - preserve_evidence
    - escalate_to_manual_review
    - generate_failure_report

# Error Handling and Recovery
error_handling:
  evidence_validation_failure:
    action: "trigger_evidence_enhancement_workflow"
    escalation: "manual_review_after_3_attempts"
    backup: "preserve_original_evidence"

  conflict_resolution_failure:
    action: "escalate_to_expert_arbitration"
    documentation: "record_conflict_details"
    backup: "preserve_all_conflicting_versions"

  production_promotion_failure:
    action: "rollback_to_staging"
    validation: "re_run_quality_gates"
    backup: "restore_previous_index_state"

# Notification and Alerting
notifications:
  stakeholders:
    - development_team
    - architecture_council
    - platform_maintainers

  channels:
    - github_issues: "governance notifications"
    - slack_channel: "#architecture-decisions"
    - email_list: "platform-governance@visión-maestra.dev"

  triggers:
    - evidence_quality_degradation
    - conflict_resolution_failure
    - production_promotion_success
    - governance_rule_violations

# Governance Rules and Policies
policies:
  evidence_requirements:
    - minimum_evidence_quality: "SOFT"
    - production_evidence_quality: "SOLID"
    - truth_score_threshold: 0.95
    - authority_score_minimum: 0.80
    - source_diversity_requirement: 3

  conflict_resolution:
    - authority_based_precedence: true
    - evidence_synthesis_preferred: true
    - temporal_precedence_fallback: true
    - expert_arbitration_complex: true

  quality_assurance:
    - automated_validation_required: true
    - manual_review_for_edge_cases: true
    - backup_before_changes: true
    - rollback_capability_required: true

# Platform-Specific Configuration
visión_maestra_config:
  component_integration:
    - bridge_architecture_compliance: true
    - real_time_streaming_considerations: true
    - 6_component_coordination_analysis: true
    - enterprise_security_requirements: true

  evidence_domains:
    - "TypeScript enterprise patterns"
    - "Node.js microservices architecture"
    - "Real-time communication protocols"
    - "Container orchestration strategies"
    - "Bridge pattern implementations"
    - "Autonomous development workflows"

  governance_standards:
    - adw_enh_001_compliance: true
    - evidence_based_decisions: true
    - authority_scoring_required: true
    - truth_score_validation: true