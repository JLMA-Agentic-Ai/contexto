# ADR Consolidation Rules - Visión Maestra Platform
# Evidence-based consolidation with authority scoring

consolidation_rules:
  evidence_synthesis:
    - rule: "merge_complementary_evidence"
      condition: "similar_topic && non_conflicting_conclusions"
      action: "combine_evidence_sections"
      preserve_sources: true
      minimum_authority_gap: 0.1

    - rule: "resolve_authority_conflicts"
      condition: "conflicting_decisions && authority_score_difference > 0.15"
      action: "select_higher_authority"
      document_alternative: true
      escalation_threshold: 0.05

    - rule: "temporal_precedence"
      condition: "equivalent_authority && recent_decision"
      action: "prefer_latest"
      max_age_days: 7
      evidence_freshness_weight: 0.2

    - rule: "evidence_quality_promotion"
      condition: "evidence_quality == SOLID && authority_score >= 0.85"
      action: "fast_track_production"
      skip_review: false

  quality_gates:
    - gate: "evidence_completeness"
      requirement: "all_evidence_sections_populated"
      minimum_sources: 3
      source_diversity_required: true

    - gate: "truth_score_validation"
      requirement: "truth_score >= 0.95"
      fallback_threshold: 0.90
      manual_review_threshold: 0.85

    - gate: "cross_reference_integrity"
      requirement: "no_broken_adr_links"
      auto_fix: true
      validate_external_links: true

    - gate: "authority_score_validation"
      requirement: "authority_score >= 0.80"
      minimum_for_production: 0.85
      expert_validation_required: false

  production_criteria:
    - criterion: "stakeholder_approval"
      requirement: "evidence_validated"
      auto_approve_threshold: 0.95
      manual_review_required: false

    - criterion: "implementation_readiness"
      requirement: "actionable_decisions"
      check_success_criteria: true
      technical_feasibility_verified: true

    - criterion: "platform_compatibility"
      requirement: "visión_maestra_integration"
      component_impact_analyzed: true
      bridge_compatibility_verified: true

consolidation_strategy:
  approach: "evidence_driven"
  conflict_resolution: "authority_based"
  quality_threshold: "enterprise"
  automation_level: "high"

visión_maestra_specific:
  component_integration_requirements:
    - "Bridge architecture compatibility"
    - "Real-time streaming impact analysis"
    - "6-component coordination effects"
    - "Enterprise security compliance"

  evidence_domains:
    - "TypeScript enterprise patterns"
    - "Node.js microservices architecture"
    - "Real-time communication protocols"
    - "Container orchestration strategies"
    - "Bridge pattern implementations"
    - "Autonomous development workflows"